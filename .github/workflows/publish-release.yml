name: Publish SufyanTreble release

on:
  workflow_dispatch:
    inputs:
      drive_id:
        description: "Google Drive file id of the image .img.xz (single-file mode)"
        required: false
        default: ""
      drive_ids:
        description: "Comma-separated Google Drive file ids of the .img.xz parts, in order (parts mode)"
        required: false
        default: ""
      sha256:
        description: "Expected sha256 of the image .img.xz"
        required: true
      version:
        description: "Release version, e.g. 1.1"
        required: true
      asset_name:
        description: "Override asset file name (default: SufyanTreble-v<version>-arm64-ab.img.xz)"
        required: false
        default: ""
      release_tag:
        description: "Override release tag (default: v<version>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download image from Drive
        run: |
          ASSET="${{ inputs.asset_name }}"
          if [ -z "$ASSET" ]; then ASSET="SufyanTreble-v${{ inputs.version }}-arm64-ab.img.xz"; fi
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.drive_ids }}" ]; then
            mkdir -p parts
            i=0
            IFS=',' read -ra IDS <<< "${{ inputs.drive_ids }}"
            for id in "${IDS[@]}"; do
              printf -v name "parts/part%02d" "$i"
              echo "Downloading part $i (Drive id $id)"
              curl -L "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" -o "$name"
              ls -la "$name"
              i=$((i+1))
            done
            cat parts/part* > "$ASSET"
          else
            curl -L "https://drive.usercontent.google.com/download?id=${{ inputs.drive_id }}&export=download&confirm=t" -o "$ASSET"
          fi
          ls -la "$ASSET"

      - name: Verify checksum (fallback to gdown if the direct fetch was an interstitial)
        run: |
          if ! echo "${{ inputs.sha256 }}  $ASSET" | sha256sum -c -; then
            if [ -n "${{ inputs.drive_ids }}" ]; then
              echo "Joined parts did not match; retrying each part with gdown"
              pip install --quiet gdown
              i=0
              IFS=',' read -ra IDS <<< "${{ inputs.drive_ids }}"
              for id in "${IDS[@]}"; do
                printf -v name "parts/part%02d" "$i"
                gdown "${id}" -O "$name"
                ls -la "$name"
                i=$((i+1))
              done
              cat parts/part* > "$ASSET"
              echo "${{ inputs.sha256 }}  $ASSET" | sha256sum -c -
            else
              echo "Direct fetch did not match; retrying with gdown"
              pip install --quiet gdown
              gdown "${{ inputs.drive_id }}" -O "$ASSET"
              echo "${{ inputs.sha256 }}  $ASSET" | sha256sum -c -
            fi
          fi

      - name: Write release notes
        run: |
          SIZE=$(stat -c%s "$ASSET")
          cat > notes.md <<EOF
          **SufyanTreble v${{ inputs.version }}** — a lightweight custom GSI for the Realme Note 50 (Android 15, arm64, A/B). Made by Abu Sufyan.

          See the repository README for what is inside and the DSU-first guidance. Try it safely with DSU first (temporary boot, a reboot returns to your current ROM). Flash only after the checklist passes: home screen, calls, SMS, Wi-Fi, camera, fingerprint, Play Store sign-in.

          Asset: $ASSET — $SIZE B — sha256 ${{ inputs.sha256 }}
          EOF

      - name: Create release with asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="v${{ inputs.version }}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "SufyanTreble v${{ inputs.version }}" --notes-file notes.md
          fi
